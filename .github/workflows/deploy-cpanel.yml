name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code into cPanel
        run: |
          curl -sS --fail-with-body \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update?repository_root=/home/${{ secrets.CPANEL_USER }}/digihub-git&branch=main" \
            | tee update.json
          jq -e '.status == 1' update.json

      - name: Run deploy (.cpanel.yml)
        run: |
          curl -sS --fail-with-body \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControlDeployment/create?repository_root=/home/${{ secrets.CPANEL_USER }}/digihub-git" \
            | tee deploy.json
          jq -e '.status == 1' deploy.json
